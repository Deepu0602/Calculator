<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

  
    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful images by category</p>
    </header>
 
    <div class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="nature">
            Nature
        </button>

        <button class="filter-btn" data-filter="animals">
            Animals
        </button>

        <button class="filter-btn" data-filter="cities">
            Cities
        </button>

        <button class="filter-btn" data-filter="travel">
            Travel
        </button>

    </div>

 
    <main class="gallery">

        <!-- Nature -->
        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                alt="Mountain landscape">
            <div class="overlay">
                <h3>Mountain</h3>
                <p>Nature</p>
            </div>
        </div>


        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                alt="Forest">
            <div class="overlay">
                <h3>Forest</h3>
                <p>Nature</p>
            </div>
        </div>

 
        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=800&q=80"
                alt="Elephant">
            <div class="overlay">
                <h3>Elephant</h3>
                <p>Animals</p>
            </div>
        </div>


        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80"
                alt="Cat">
            <div class="overlay">
                <h3>Cat</h3>
                <p>Animals</p>
            </div>
        </div>

 
        <div class="gallery-item" data-category="cities">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                alt="City">
            <div class="overlay">
                <h3>City</h3>
                <p>Cities</p>
            </div>
        </div>


        <div class="gallery-item" data-category="cities">
            <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80"
                alt="City buildings">
            <div class="overlay">
                <h3>Buildings</h3>
                <p>Cities</p>
            </div>
        </div>

 
        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                alt="Beach">
            <div class="overlay">
                <h3>Beach</h3>
                <p>Travel</p>
            </div>
        </div>


        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                alt="Travel destination">
            <div class="overlay">
                <h3>Adventure</h3>
                <p>Travel</p>
            </div>
        </div>

    </main>


    <div class="lightbox" id="lightbox">

        <button class="close" id="closeBtn">
            &times;
        </button>

        <button class="prev" id="prevBtn">
            &#10094;
        </button>

        <div class="lightbox-content">

            <img id="lightboxImage" src="" alt="">

            <h2 id="lightboxTitle"></h2>

            <p id="lightboxCategory"></p>

        </div>

        <button class="next" id="nextBtn">
            &#10095;
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
